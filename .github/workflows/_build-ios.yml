# ── Internal Build Callee — iOS / iPadOS App Store Distribution ──────────────
# Produces a signed .ipa for App Store Connect (TestFlight + App Store),
# published as a GitHub Actions workflow artifact (named by the artifact-name
# input; default "ios-build"). An orchestrator (distribute-beta/release.yml)
# downloads the artifact and pushes it via `xcrun altool --upload-app --type ios`.
#
# iOS has ONE distribution channel. There is no notarization, no stapling, no
# Gatekeeper assessment, no DMG/ZIP, no Sparkle appcast, no Developer ID —
# everything ships through App Store Connect.
#
# Underscore prefix marks this as an internal callee — per-app shells should
# call distribute-beta.yml / distribute-release.yml, not this file directly.
#
# Required caller secrets:
#   APPLE_DISTR_P12_BASE64  — Apple Distribution cert + private key (signs the .app)
#   APPLE_DISTR_PASSWORD    — password for the Apple Distribution p12
#   KEYCHAIN_PASSWORD       — ephemeral build keychain password
#   PROV_PROF_STORE_BASE64  — App Store provisioning profile (.mobileprovision)
#
# Required caller inputs (product identity comes from the caller's product list):
#   scheme, bundle-id
#
# NOTE ON EMBEDDED TARGETS: this callee signs the main app bundle only. An app
# with a widget, share extension, App Intents extension or Watch app needs one
# extra provisioning profile per embedded bundle id — see the README. CarPlay is
# an entitlement on the main app's profile and needs nothing here; App Intents
# compiled into the main app target likewise.
# ─────────────────────────────────────────────────────────────────────────────
name: _build-ios

on:
  workflow_call:
    inputs:
      # ── Required ───────────────────────────────────────────────────────────
      version:
        description: "Marketing version (CFBundleShortVersionString)"
        required: true
        type: string
      build-number:
        description: "Build number (CFBundleVersion), timestamp-based"
        required: true
        type: string
      artifact-label:
        description: "Label for artifact filenames"
        required: true
        type: string

      # ── Product identity (supplied by the caller's product list) ────────────
      scheme:
        description: "Xcode scheme to archive."
        required: true
        type: string
      bundle-id:
        description: "Main app bundle id — the provisioningProfiles dict key."
        required: true
        type: string

      # ── Optional ───────────────────────────────────────────────────────────
      artifact-name:
        description: "Name of the uploaded GH Actions artifact (callers suffix it per product)."
        required: false
        type: string
        default: "ios-build"
      runs-on:
        description: 'JSON-encoded runner, e.g. ''["self-hosted","macOS"]'' or ''"macos-26"''.'
        required: false
        type: string
        default: '["self-hosted","macOS"]'
      lfs:
        description: "Pull git LFS objects on checkout."
        required: false
        type: boolean
        default: false
      artifact-retention-days:
        description: "Retention for the uploaded artifacts."
        required: false
        type: number
        default: 7
      use-tuist:
        description: "Generate the Xcode project with Tuist before building."
        required: false
        type: boolean
        default: false
      configuration:
        description: "Xcode build configuration."
        required: false
        type: string
        default: "Release"
      extra-xcodebuild-args:
        description: "Extra build settings appended to xcodebuild archive (word-split)."
        required: false
        type: string
        default: ""

    secrets:
      APPLE_DISTR_P12_BASE64:
        required: true
      APPLE_DISTR_PASSWORD:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      PROV_PROF_STORE_BASE64:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          lfs: ${{ inputs.lfs }}

      # ── Tuist (opt-in) ─────────────────────────────────────────────────────
      - name: Install Tuist (via mise)
        if: inputs.use-tuist
        shell: bash
        run: |
          set -euo pipefail
          # The `brew tap tuist/tuist` cask is broken upstream (invalid
          # `conflicts_with formula:` stanza), so Tuist is installed through mise,
          # via its official one-liner (the method used on the self-hosted runner).
          # mise lands in ~/.local/bin — add it to PATH now and to $GITHUB_PATH so
          # the Fetch/Generate steps below find it. A committed mise.toml pin is
          # honored, else latest. CI sets CI=true so mise auto-trusts the config.
          export PATH="$HOME/.local/bin:$PATH"
          command -v mise >/dev/null 2>&1 || curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mise install
          mise exec -- tuist --version >/dev/null 2>&1 || mise use tuist@latest

      - name: Fetch Swift package dependencies (Tuist)
        if: inputs.use-tuist
        shell: bash
        run: mise exec -- tuist install

      - name: Generate Xcode project (Tuist)
        if: inputs.use-tuist
        shell: bash
        run: mise exec -- tuist generate --no-open

      # ── SwiftPM (when not Tuist) ───────────────────────────────────────────
      - name: Resolve Swift package dependencies
        if: ${{ !inputs.use-tuist }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme "${{ inputs.scheme }}" \
            -configuration Release

      # ── Diagnostic: verify .p12 envelope before security import ────────────
      # `security import` only says "MAC verification failed (wrong password?)"
      # which conflates: bad base64, wrong password, incompatible crypto.
      # We run openssl to get a clearer signal — but DON'T trust its exit code:
      # OpenSSL 3.x exits non-zero on legacy cert PBE algorithms (e.g. RC2)
      # even when the MAC verified fine, because the default provider can't
      # enumerate the safebags. Instead we look for explicit "Mac verify error"
      # in the output, which is the only reliable wrong-password signal.
      - name: Verify .p12 envelope (diagnostic)
        shell: bash
        env:
          APPLE_DISTR_P12_BASE64: ${{ secrets.APPLE_DISTR_P12_BASE64 }}
          APPLE_DISTR_PASSWORD: ${{ secrets.APPLE_DISTR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_DISTR_P12_BASE64" | base64 --decode > /tmp/certificate-check.p12

          SIZE=$(wc -c < /tmp/certificate-check.p12)
          echo "Decoded .p12 size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::.p12 is suspiciously small ($SIZE bytes) — likely a base64 encoding issue with APPLE_DISTR_P12_BASE64"
            exit 1
          fi

          # Don't fail on non-zero exit; we evaluate the output instead.
          # -nokeys: never print private keys (essential).
          # -nocerts: also suppress cert PEM blocks. Certs are public so this
          # is paranoid but trims the log to envelope metadata only.
          openssl pkcs12 -in /tmp/certificate-check.p12 -info -nokeys -nocerts \
            -passin "pass:$APPLE_DISTR_PASSWORD" > /tmp/p12-info.txt 2>&1 || true

          echo "── openssl output ──────────────────────────────────────────"
          cat /tmp/p12-info.txt
          echo "────────────────────────────────────────────────────────────"

          if grep -qE "Mac verify error|invalid password" /tmp/p12-info.txt; then
            echo "::error::Password mismatch — APPLE_DISTR_PASSWORD does not match the .p12"
            rm -f /tmp/certificate-check.p12 /tmp/p12-info.txt
            exit 1
          fi

          echo "Envelope check passed — no MAC verification error. (security import will validate the rest.)"
          rm -f /tmp/certificate-check.p12 /tmp/p12-info.txt

      # ── Keychain ───────────────────────────────────────────────────────────
      # iOS App Store distribution needs ONE cert: Apple Distribution, which
      # signs the .app. (macOS additionally needs Mac Installer Distribution to
      # sign a .pkg via productbuild — iOS exports a .ipa, so neither applies.)
      - name: Set up keychain
        shell: bash
        env:
          APPLE_DISTR_P12_BASE64: ${{ secrets.APPLE_DISTR_P12_BASE64 }}
          APPLE_DISTR_PASSWORD: ${{ secrets.APPLE_DISTR_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$APPLE_DISTR_P12_BASE64" | base64 --decode > /tmp/apple-distr.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          security import /tmp/apple-distr.p12 \
            -k build.keychain \
            -P "$APPLE_DISTR_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            build.keychain
          security list-keychains -d user -s build.keychain login.keychain

          rm /tmp/apple-distr.p12

      # ── Provisioning profile ───────────────────────────────────────────────
      # iOS profiles carry the .mobileprovision extension (macOS uses
      # .provisionprofile) but live in the SAME directory. The team id is read
      # off the profile here, so no team-id input is needed anywhere.
      - name: Install provisioning profile
        shell: bash
        env:
          STORE_PROFILE_BASE64: ${{ secrets.PROV_PROF_STORE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$STORE_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/pp-main.mobileprovision"

          PROFILE_PLIST=$(security cms -D -i "$PROFILE_DIR/pp-main.mobileprovision")
          PROFILE_NAME=$(plutil -extract Name raw - <<<"$PROFILE_PLIST")
          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw - <<<"$PROFILE_PLIST")

          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "App Store profile: $PROFILE_NAME (team $TEAM_ID)"

      # ── Verify signing identity (debug) ────────────────────────────────────
      - name: Verify signing identity
        shell: bash
        run: security find-identity -v -p codesigning build.keychain

      # ── Archive ────────────────────────────────────────────────────────────
      - name: Archive
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # App Store Connect requires CFBundleShortVersionString to be 1-3
          # dotted integers (e.g. "2.10.0"). Strip any suffix. Build number
          # remains the per-build differentiator (CFBundleVersion).
          MARKETING_VERSION="${INPUT_VERSION%%-*}"
          echo "Marketing version (stripped for ASC): ${MARKETING_VERSION}"
          echo "Build number:                          ${{ inputs.build-number }}"

          # LB-459: /tmp/build persists across jobs on a self-hosted runner. Start
          # from a clean slot so a prior product's (or a killed job's) archive /
          # export can't ride along in the *.ipa upload glob below.
          rm -rf /tmp/build
          mkdir -p /tmp/build

          # Deliberately NO PROVISIONING_PROFILE_SPECIFIER: it is a project-wide
          # xcodebuild setting, so it silently mis-signs every embedded target in
          # a multi-target app. Signing is pinned at EXPORT instead, per bundle id,
          # via ExportOptions.provisioningProfiles below.
          xcodebuild archive \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -archivePath /tmp/build/app.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION=${MARKETING_VERSION} \
            CURRENT_PROJECT_VERSION=${{ inputs.build-number }} \
            ${{ inputs.extra-xcodebuild-args }}

      # ── Export ─────────────────────────────────────────────────────────────
      - name: Export for App Store distribution
        shell: bash
        env:
          BUNDLE_ID: ${{ inputs.bundle-id }}
        run: |
          set -euo pipefail

          # manageAppVersionAndBuildNumber defaults to TRUE for app-store-connect
          # exports on Xcode 13+, which rewrites CFBundleVersion at export time and
          # would destroy the monotonic timestamp build number this pipeline relies
          # on (and with it classify-upload.sh's -19232 collision semantics).
          cat > /tmp/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath /tmp/build/app.xcarchive \
            -exportPath /tmp/build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist

          ls -lh /tmp/build/export/

      # ── Diagnostic on export failure ───────────────────────────────────────
      # xcodebuild writes detailed logs to a temp .xcdistributionlogs directory.
      # Print key info inline (keychain identities + log contents) and stage
      # the directory for upload in the next step. Only runs on failure so it
      # doesn't pollute successful runs.
      - name: Diagnose export failure
        if: failure()
        shell: bash
        run: |
          echo "── Keychain identities (codesigning policy) ───────────────"
          security find-identity -v -p codesigning build.keychain || true
          echo ""
          echo "── ALL keychain identities (no policy filter) ────────────"
          security find-identity -v build.keychain || true
          echo ""
          echo "── xcdistributionlogs ────────────────────────────────────"
          # find through /var/folders triggers permission warnings → noisy
          # exits under pipefail. Search $TMPDIR first (where xcodebuild
          # actually writes), fall back to /var/folders with || true so a
          # failed find doesn't kill the diagnostic.
          LOG_DIR=""
          if [ -n "${TMPDIR:-}" ]; then
            LOG_DIR=$(find "$TMPDIR" -maxdepth 2 -name "*.xcdistributionlogs" -type d 2>/dev/null | head -1 || true)
          fi
          if [ -z "$LOG_DIR" ]; then
            LOG_DIR=$(find /var/folders -maxdepth 6 -name "*.xcdistributionlogs" -type d 2>/dev/null | head -1 || true)
          fi
          if [ -z "$LOG_DIR" ]; then
            echo "No xcdistributionlogs directory found"
            exit 0
          fi
          echo "Found: $LOG_DIR"
          echo ""
          ls -la "$LOG_DIR"
          for f in "$LOG_DIR"/*; do
            [ -f "$f" ] || continue
            echo ""
            echo "── $(basename "$f") ──────────────────────────────────"
            cat "$f"
          done
          # Stage for the upload step (paths in /var/folders aren't artifact-friendly)
          mkdir -p /tmp/diag-logs
          cp -R "$LOG_DIR" /tmp/diag-logs/

      - name: Upload xcdistributionlogs as artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcdistributionlogs-${{ inputs.artifact-name }}
          path: /tmp/diag-logs/
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact-retention-days }}

      # ── Publish as workflow artifact ───────────────────────────────────────
      - name: Upload .ipa as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: /tmp/build/export/*.ipa
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}

      # ── Cleanup ────────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          security delete-keychain build.keychain || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/pp-main.mobileprovision"
          rm -rf /tmp/build /tmp/diag-logs
          rm -f /tmp/ExportOptions.plist
          security list-keychains -d user -s login.keychain
