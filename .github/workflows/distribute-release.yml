# ── Release Distribution Orchestrator (iOS) ──────────────────────────────────
# Fired on a pushed release tag. `plan-release` parses `<id>-v<X.Y.Z>` (or a bare
# `vX.Y.Z` for the primary product) → the single target product, validates the
# version against THAT product's inline changelog, then builds it, uploads the
# .ipa to App Store Connect, and creates a notes-only GitHub Release.
#
# UPLOAD ONLY: this does not create the App Store version or submit for review —
# do that in the App Store Connect UI once the build finishes processing.
#
# Per-app shell:
#
#   on:
#     push:
#       tags:
#         - '*-v*'            # per-product, e.g. main-v2.13.0
#         - 'v*'              # the primary product, e.g. v2.13.0
#         - '!*-beta.*'
#         - '!*-alpha.*'
#   jobs:
#     release:
#       uses: LeanBytes/workflows-ios/.github/workflows/distribute-release.yml@v0.1.0
#       secrets: ...   # explicit block — see examples/per-app/distribute-release.yml
# ─────────────────────────────────────────────────────────────────────────────
name: distribute-release

on:
  workflow_call:
    inputs:
      products-dir:
        description: "Directory of per-product Config/products/<id>.json files."
        type: string
        default: "Config/products"

      distribute:
        description: "Upload the built .ipa to App Store Connect. A product file overrides this per product."
        type: boolean
        default: true

      use-tuist:
        description: "Project is generated by Tuist (runs tuist install + generate before build)"
        type: boolean
        default: false

      extra-xcodebuild-args:
        description: "Additional xcodebuild settings appended to the archive command."
        type: string
        default: ""
      configuration:
        description: "Xcode build configuration. Default 'Release'."
        type: string
        default: "Release"

      runs-on-build:
        description: "JSON-encoded runner for the build job. Defaults to self-hosted macOS."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-publish:
        description: "JSON-encoded runner for the publish job. Defaults to self-hosted macOS."
        type: string
        default: '["self-hosted","macOS"]'

      lfs:
        description: "Pull the caller repo's git LFS files on build checkouts. Off by default."
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to keep uploaded artifacts (default 7)."
        type: number
        default: 7

      create-discussion:
        description: "Open a GitHub Discussion alongside the Release. Needs Discussions + the exact category."
        type: boolean
        default: false
      discussion-category:
        description: "Discussion category for create-discussion."
        type: string
        default: "Announcements"

    secrets:
      APPLE_DISTR_P12_BASE64:     { required: false }
      APPLE_DISTR_PASSWORD:       { required: false }
      APPLE_DISTR_P12_ALT_BASE64: { required: false }   # per-product cert override target
      APPLE_DISTR_PASSWORD_ALT:   { required: false }
      KEYCHAIN_PASSWORD:          { required: false }
      PROV_PROF_STORE_BASE64:     { required: false }
      PROV_PROF_STORE_PRO_BASE64: { required: false }   # per-product profile override target
      ASC_KEY_ID:                 { required: false }
      ASC_ISSUER_ID:              { required: false }
      ASC_KEY_BASE64:             { required: false }
      SHARED_WORKFLOWS_TOKEN:     { required: false }

permissions:
  contents: write          # create the GH Release
  discussions: write       # opt-in create-discussion

jobs:
  prepare:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    outputs:
      target-id: ${{ steps.plan.outputs.target-id }}
      version: ${{ steps.plan.outputs.version }}
      build-number: ${{ steps.plan.outputs.build-number }}
      artifact-label: ${{ steps.plan.outputs.artifact-label }}
      products: ${{ steps.plan.outputs.products }}
      has-any: ${{ steps.plan.outputs.has-any }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-ios
          ref: ${{ github.job_workflow_sha }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Plan release (parse tag → scoped product, validate vs its changelog)
        id: plan
        env:
          PRODUCTS_DIR: ${{ inputs.products-dir }}
          TAG: ${{ github.ref_name }}
          DEF_DISTRIBUTE: ${{ inputs.distribute }}
        run: python3 .shared-ci/.github/scripts/products.py plan-release >> "$GITHUB_OUTPUT"

      - name: Show target
        run: echo "Releasing '${{ steps.plan.outputs.target-id }}' v${{ steps.plan.outputs.version }} from tag '${{ github.ref_name }}'"

  build:
    if: needs.prepare.outputs.has-any == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.prepare.outputs.products) }}
    uses: LeanBytes/workflows-ios/.github/workflows/_build-ios.yml@v0.1.0
    with:
      version: ${{ needs.prepare.outputs.version }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-label: ${{ needs.prepare.outputs.artifact-label }}
      artifact-name: ios-build-${{ matrix.product.id }}
      scheme: ${{ matrix.product.scheme }}
      bundle-id: ${{ matrix.product.bundle-id }}
      use-tuist: ${{ inputs.use-tuist }}
      runs-on: ${{ inputs.runs-on-build }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      configuration: ${{ inputs.configuration }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      APPLE_DISTR_P12_BASE64: ${{ matrix.product.cert-secret != '' && secrets[matrix.product.cert-secret] || secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:   ${{ matrix.product.cert-password-secret != '' && secrets[matrix.product.cert-password-secret] || secrets.APPLE_DISTR_PASSWORD }}
      KEYCHAIN_PASSWORD:      ${{ secrets.KEYCHAIN_PASSWORD }}
      PROV_PROF_STORE_BASE64: ${{ matrix.product.profile-secret != '' && secrets[matrix.product.profile-secret] || secrets.PROV_PROF_STORE_BASE64 }}

  publish-release:
    needs: [prepare, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runs-on-publish) }}
    timeout-minutes: 30
    env:
      TARGET_ID: ${{ needs.prepare.outputs.target-id }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      ARTIFACT_LABEL: ${{ needs.prepare.outputs.artifact-label }}
      PRODUCTS_JSON: ${{ needs.prepare.outputs.products }}
      PRODUCTS_DIR: ${{ inputs.products-dir }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-ios
          ref: ${{ github.job_workflow_sha }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Download ios-build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ios-build-*
          path: ./artifacts/ios

      # \x1f-delimited (NOT tab — tab is IFS-whitespace and collapses empty
      # columns). Read: id pname dist
      - name: Expand products
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PRODUCTS_JSON" > /tmp/products.tsv <<'PY'
          import json, sys
          fields = ["id","product-name","distribute"]
          for p in json.loads(sys.argv[1]):
              print("\x1f".join(str(p.get(k, "")) for k in fields))
          PY
          echo "Release target:"; tr '\037' '\t' < /tmp/products.tsv

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          # A LONE matched artifact is extracted flat into the base path with no
          # per-artifact subdir — and a release always builds exactly one product,
          # so this path is the norm here, not the exception.
          while IFS=$'\x1f' read -r id _; do
            base="./artifacts/ios"; want="$base/ios-build-$id"
            if [ -d "$base" ] && [ ! -d "$want" ] && [ -n "$(find "$base" -maxdepth 1 -type f 2>/dev/null)" ]; then
              mkdir -p "$want"
              find "$base" -maxdepth 1 -type f -exec mv {} "$want"/ \;
              echo "re-nested flattened artifact → $want/"
            fi
          done < /tmp/products.tsv

      # ── Release notes: the target product's changelog at the EXACT version ─
      - name: Read release notes
        shell: bash
        run: |
          set -euo pipefail
          CHANGELOG_PATH="${PRODUCTS_DIR}/${TARGET_ID}.json" VERSION="$VERSION" \
            .shared-ci/.github/scripts/changelog-from-json.sh > /tmp/notes.md || true
          echo "── notes ──"; cat /tmp/notes.md || true

      # ── GATE: App Store Connect upload ────────────────────────────────────
      - name: Install App Store Connect API key (for altool)
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Upload to App Store Connect
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -uo pipefail
          source .shared-ci/.github/scripts/classify-upload.sh
          while IFS=$'\x1f' read -r id pname dist; do
            [ "$dist" = "True" ] || { echo "product $id: distribute=false — skipping upload"; continue; }
            echo "::group::ASC upload — product=$id"
            IPA=$(ls ./artifacts/ios/ios-build-$id/*.ipa 2>/dev/null | head -1 || true)
            if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
              echo "::error::No .ipa for product $id"; echo "::endgroup::"; exit 1
            fi
            # errexit off around the capture: a non-zero altool exit must reach
            # the classifier below, not abort the step.
            set +e
            OUTPUT=$(xcrun altool --upload-app --type ios --file "$IPA" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
            RC=$?
            set -e
            echo "$OUTPUT"
            case "$(classify_upload "$RC" "$OUTPUT")" in
              accepted)        echo "ASC upload accepted for $id"; echo "::endgroup::"; continue ;;
              already-present) echo "Build for $id already present — treating as success."; echo "::endgroup::"; continue ;;
            esac
            echo "::error::altool failed for $id (exit ${RC})"; echo "::endgroup::"; exit 1
          done < /tmp/products.tsv

      # ── FINAL: GitHub Release for the pushed tag (notes only) ─────────────
      # Last, so a failed upload never leaves a Release claiming the version shipped.
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_DISCUSSION: ${{ inputs.create-discussion }}
          DISCUSSION_CATEGORY: ${{ inputs.discussion-category }}
        run: |
          set -euo pipefail
          ARGS=(--repo "${{ github.repository }}" --title "${{ github.ref_name }}")
          if [ -f /tmp/notes.md ] && [ -s /tmp/notes.md ]; then
            ARGS+=(--notes-file /tmp/notes.md)
          else
            ARGS+=(--notes "Release ${{ github.ref_name }}")
          fi
          if [ "$CREATE_DISCUSSION" = "true" ] && [ -n "$DISCUSSION_CATEGORY" ]; then
            ARGS+=(--discussion-category "$DISCUSSION_CATEGORY")
          fi
          # No `gh release upload` — an App-Store-only product has no
          # downloadable asset; the build lives in App Store Connect.
          gh release create "${{ github.ref_name }}" "${ARGS[@]}"

      - name: Write release summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release ${{ github.ref_name }} published ✅"
            echo
            echo "**Product:** \`${TARGET_ID}\` · **Version:** \`${VERSION}\` · **Build:** \`${BUILD_NUMBER}\`"
            echo
            echo "The build was uploaded to App Store Connect. Create the App Store version and"
            echo "submit it for review in ASC once processing finishes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f /tmp/notes.md /tmp/products.tsv
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
