name: selftest

# CI for workflows-ios itself (the repo has no other self-CI): lint every
# workflow, including the example shells apps copy verbatim, and run the
# products.py offline suite whenever .github/**, tests/** or examples/**
# change. The `job_workflow_sha` context and shellcheck style findings are
# ignored (the former is an actionlint gap; the latter are the intentional
# "read all TSV columns, use a subset" publish loops).

on:
  pull_request:
    paths:
      - '.github/**'
      - 'tests/**'
      - 'examples/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'tests/**'
      - 'examples/**'

permissions:
  contents: read

jobs:
  lint-and-test:
    # ubuntu-latest, and NOT self-hosted like the rest of this repo. No
    # self-hosted runner is attached to workflows-ios — the org's Mac serves the
    # app repos — so `[self-hosted, macOS]` here queued for 24h and was cancelled,
    # and v0.1.1 and v0.2.0 shipped untested (a queued job never goes red, #8).
    # Nothing here needs a Mac: actionlint is a static binary and the tests are
    # offline python3 + git. Same fix as workflows-macos#14.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        # Into a temp dir, not the workspace: a self-hosted runner reuses its
        # checkout, so dropping the binary next to the sources would leave an
        # untracked ./actionlint behind between runs.
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" \
            -ignore 'property "job_workflow_sha" is not defined' \
            -ignore 'shellcheck reported issue' \
            .github/workflows/*.yml examples/per-app/*.yml

      - name: products.py offline tests
        run: bash tests/run.sh
