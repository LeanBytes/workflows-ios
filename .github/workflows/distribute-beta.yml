# ── Beta Distribution Orchestrator (iOS) ─────────────────────────────────────
# Fired on every push to main. Discovers Config/products/<id>.json, cuts a beta
# for each product whose OWN file (or its source-paths) changed since its last
# beta AND whose version isn't released yet, builds each one, uploads the .ipa
# to App Store Connect (TestFlight), then pushes each product's own
# `<id>-v<ver>-beta.N` tag + a notes-only GitHub pre-release.
#
# iOS ships through ONE channel, so unlike the macOS sibling there is no
# direct/store split: a single `has-any` boolean gates the build job (an empty
# matrix throws rather than skipping, so the boolean is load-bearing).
#
# TestFlight groups, tester assignment and "What to Test" are configured in App
# Store Connect — this workflow only uploads the build.
#
# Per-app shell:
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     beta:
#       uses: LeanBytes/workflows-ios/.github/workflows/distribute-beta.yml@v0.1.1
#       secrets: ...   # explicit block — see examples/per-app/distribute-beta.yml
# ─────────────────────────────────────────────────────────────────────────────
name: distribute-beta

on:
  workflow_call:
    inputs:
      products-dir:
        description: "Directory of per-product Config/products/<id>.json files."
        type: string
        default: "Config/products"

      distribute:
        description: "Upload the built .ipa to App Store Connect. A product file overrides this per product."
        type: boolean
        default: true

      use-tuist:
        description: "Project is generated by Tuist (runs tuist install + generate before build)"
        type: boolean
        default: false

      extra-xcodebuild-args:
        description: "Additional xcodebuild settings appended to the archive command."
        type: string
        default: ""
      configuration:
        description: "Xcode build configuration. Default 'Release'."
        type: string
        default: "Release"

      runs-on-build:
        description: "JSON-encoded runner for the build job. Defaults to self-hosted macOS."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-publish:
        description: "JSON-encoded runner for the publish job. Defaults to self-hosted macOS."
        type: string
        default: '["self-hosted","macOS"]'
      runs-on-prepare:
        description: "JSON-encoded runner for the coordination jobs (discover/prepare — checkout + python3, no Xcode). Defaults to self-hosted macOS."
        type: string
        default: '["self-hosted","macOS"]'

      lfs:
        description: "Pull the caller repo's git LFS files on build checkouts. Off by default."
        type: boolean
        default: false
      artifact-retention-days:
        description: "Days to keep uploaded artifacts (default 7)."
        type: number
        default: 7

      # ── Tests (opt-in) — gate the beta on the app's Swift tests ────────────
      run-tests:
        description: "Gate the beta on tests. A failing test skips build + publish and files a Jira ticket."
        type: boolean
        default: false
      test-runner:
        description: "xcodebuild | swift | both."
        type: string
        default: "xcodebuild"
      test-scheme:
        description: "Scheme to test. Defaults to the first discovered product's scheme."
        type: string
        default: ""
      test-plan:
        type: string
        default: ""
      test-destination:
        description: "xcodebuild -destination for the test run. Defaults to an iOS Simulator."
        type: string
        default: ""
      xcodebuild-test-args:
        type: string
        default: ""
      app-name:
        type: string
        default: ""
      swift-package-path:
        type: string
        default: "."
      swift-test-filter:
        type: string
        default: ""
      coverage-min:
        type: string
        default: ""

    secrets:
      APPLE_DISTR_P12_BASE64:     { required: false }
      APPLE_DISTR_PASSWORD:       { required: false }
      APPLE_DISTR_P12_ALT_BASE64: { required: false }   # per-product cert override target
      APPLE_DISTR_PASSWORD_ALT:   { required: false }
      KEYCHAIN_PASSWORD:          { required: false }
      PROV_PROF_STORE_BASE64:     { required: false }
      PROV_PROF_STORE_PRO_BASE64: { required: false }   # per-product profile override target
      ASC_KEY_ID:                 { required: false }
      ASC_ISSUER_ID:              { required: false }
      ASC_KEY_BASE64:             { required: false }
      JIRA_API_TOKEN:             { required: false }
      SHARED_WORKFLOWS_TOKEN:     { required: false }

permissions:
  contents: write

# Repo-wide, never cancelled: two pushes racing on a product's beta counter
# would otherwise produce duplicate -beta.N tags.
concurrency:
  group: distribute-beta-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ${{ fromJSON(inputs.runs-on-prepare) }}
    timeout-minutes: 5
    outputs:
      products: ${{ steps.plan.outputs.beta-products }}
      has-any: ${{ steps.plan.outputs.has-any }}
      build-number: ${{ steps.plan.outputs.build-number }}
      test-scheme: ${{ steps.plan.outputs.test-scheme }}
      test-app-name: ${{ steps.plan.outputs.test-app-name }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0       # full history + tags for the changelog-diff
          fetch-tags: true

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-ios
          ref: ${{ github.job_workflow_sha }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Plan betas (changelog-driven cutting set)
        id: plan
        env:
          PRODUCTS_DIR: ${{ inputs.products-dir }}
          DEF_DISTRIBUTE: ${{ inputs.distribute }}
        run: python3 .shared-ci/.github/scripts/products.py plan-beta >> "$GITHUB_OUTPUT"

      - name: Show cutting set
        run: |
          echo "has-any = ${{ steps.plan.outputs.has-any }}"
          echo '${{ steps.plan.outputs.products }}' | python3 -m json.tool || echo "(empty)"

  # ── Tests (opt-in) — gate before build/publish ───────────────────────────
  test:
    if: inputs.run-tests
    needs: prepare
    uses: LeanBytes/workflows-ios/.github/workflows/_test.yml@v0.1.1
    with:
      test-runner: ${{ inputs.test-runner }}
      runs-on: ${{ inputs.runs-on-build }}
      runs-on-gate: ${{ inputs.runs-on-prepare }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
      test-scheme: ${{ inputs.test-scheme != '' && inputs.test-scheme || needs.prepare.outputs.test-scheme }}
      test-plan: ${{ inputs.test-plan }}
      test-destination: ${{ inputs.test-destination }}
      use-tuist: ${{ inputs.use-tuist }}
      xcodebuild-test-args: ${{ inputs.xcodebuild-test-args }}
      app-name: ${{ inputs.app-name != '' && inputs.app-name || needs.prepare.outputs.test-app-name }}
      swift-package-path: ${{ inputs.swift-package-path }}
      swift-test-filter: ${{ inputs.swift-test-filter }}
      coverage-min: ${{ inputs.coverage-min }}
      file-jira-on-failure: true
      gate-on-new-commit: false
    secrets:
      JIRA_API_TOKEN:         ${{ secrets.JIRA_API_TOKEN }}
      SHARED_WORKFLOWS_TOKEN: ${{ secrets.SHARED_WORKFLOWS_TOKEN }}

  # A job `if:` cannot read `matrix`, and an empty matrix throws rather than
  # skipping — so the presence boolean from `prepare` is the gate.
  build:
    if: ${{ always() && needs.prepare.result == 'success' && needs.test.result != 'failure' && needs.prepare.outputs.has-any == 'true' }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.prepare.outputs.products) }}
    uses: LeanBytes/workflows-ios/.github/workflows/_build-ios.yml@v0.1.1
    with:
      version: ${{ matrix.product.marketing }}        # bare X.Y.Z — ASC rejects suffixes
      build-number: ${{ needs.prepare.outputs.build-number }}
      artifact-label: ${{ matrix.product.artifact-label }}
      artifact-name: ios-build-${{ matrix.product.id }}
      scheme: ${{ matrix.product.scheme }}
      bundle-id: ${{ matrix.product.bundle-id }}
      use-tuist: ${{ inputs.use-tuist }}
      runs-on: ${{ inputs.runs-on-build }}
      extra-xcodebuild-args: ${{ inputs.extra-xcodebuild-args }}
      configuration: ${{ inputs.configuration }}
      lfs: ${{ inputs.lfs }}
      artifact-retention-days: ${{ inputs.artifact-retention-days }}
    secrets:
      APPLE_DISTR_P12_BASE64: ${{ matrix.product.cert-secret != '' && secrets[matrix.product.cert-secret] || secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:   ${{ matrix.product.cert-password-secret != '' && secrets[matrix.product.cert-password-secret] || secrets.APPLE_DISTR_PASSWORD }}
      KEYCHAIN_PASSWORD:      ${{ secrets.KEYCHAIN_PASSWORD }}
      PROV_PROF_STORE_BASE64: ${{ matrix.product.profile-secret != '' && secrets[matrix.product.profile-secret] || secrets.PROV_PROF_STORE_BASE64 }}

  publish-beta:
    needs: [prepare, test, build]
    if: ${{ always() && needs.test.result != 'failure' && needs.build.result == 'success' }}
    runs-on: ${{ fromJSON(inputs.runs-on-publish) }}
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      PRODUCTS_JSON: ${{ needs.prepare.outputs.products }}
      PRODUCTS_DIR: ${{ inputs.products-dir }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout shared scripts
        uses: actions/checkout@v6
        with:
          repository: LeanBytes/workflows-ios
          ref: ${{ github.job_workflow_sha }}
          path: .shared-ci
          token: ${{ secrets.SHARED_WORKFLOWS_TOKEN || github.token }}

      - name: Download ios-build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ios-build-*
          path: ./artifacts/ios

      # Expand the cutting set into a \x1f-delimited table (NOT tab — tab is
      # IFS-whitespace and `read` would collapse an empty column, shifting every
      # later field). Read: id pname dist ver label rtag
      - name: Expand products
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PRODUCTS_JSON" > /tmp/products.tsv <<'PY'
          import json, sys
          fields = ["id","product-name","distribute","version","artifact-label","release-tag"]
          for p in json.loads(sys.argv[1]):
              print("\x1f".join(str(p.get(k, "")) for k in fields))
          PY
          echo "Cutting set:"; tr '\037' '\t' < /tmp/products.tsv

      - name: Normalize artifact layout
        shell: bash
        run: |
          set -euo pipefail
          # actions/download-artifact extracts a LONE matched artifact flat into
          # the base path (no per-artifact subdir); multiple matches DO get subdirs
          # (merge-multiple defaults false). Re-nest a flattened artifact so the
          # per-product globs below can always assume artifacts/ios/<name>/ —
          # otherwise a single-product beta finds "No .ipa".
          while IFS=$'\x1f' read -r id _; do
            base="./artifacts/ios"; want="$base/ios-build-$id"
            if [ -d "$base" ] && [ ! -d "$want" ] && [ -n "$(find "$base" -maxdepth 1 -type f 2>/dev/null)" ]; then
              mkdir -p "$want"
              find "$base" -maxdepth 1 -type f -exec mv {} "$want"/ \;
              echo "re-nested flattened artifact → $want/"
            fi
          done < /tmp/products.tsv

      # ── Release notes: each product's own inline changelog (versions[0]) ──
      - name: Read release notes (per product)
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\x1f' read -r id pname dist ver label rtag; do
            CHANGELOG_PATH="${PRODUCTS_DIR}/$id.json" VERSION="NEXT" \
              .shared-ci/.github/scripts/changelog-from-json.sh > "/tmp/notes-$id.md" || true
          done < /tmp/products.tsv

      # ── GATE: TestFlight upload (every distributing product) ──────────────
      - name: Install App Store Connect API key (for altool)
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Upload to TestFlight (per product)
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -uo pipefail
          source .shared-ci/.github/scripts/classify-upload.sh
          while IFS=$'\x1f' read -r id pname dist ver label rtag; do
            [ "$dist" = "True" ] || { echo "product $id: distribute=false — skipping upload"; continue; }
            echo "::group::TestFlight upload — product=$id"
            IPA=$(ls ./artifacts/ios/ios-build-$id/*.ipa 2>/dev/null | head -1 || true)
            if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
              echo "::error::No .ipa for product $id"; echo "::endgroup::"; exit 1
            fi
            # errexit off around the capture: a non-zero altool exit must reach
            # the classifier below, not abort the step.
            set +e
            OUTPUT=$(xcrun altool --upload-app --type ios --file "$IPA" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)
            RC=$?
            set -e
            echo "$OUTPUT"
            case "$(classify_upload "$RC" "$OUTPUT")" in
              accepted)        echo "TestFlight upload accepted for $id"; echo "::endgroup::"; continue ;;
              already-present) echo "Build for $id already present — treating as success."; echo "::endgroup::"; continue ;;
            esac
            echo "::error::altool failed for $id (exit ${RC})"; echo "::endgroup::"; exit 1
          done < /tmp/products.tsv

      # ── Per product: push its own beta tag + pre-release (notes only) ─────
      # LAST, so a failed upload never leaves a tag claiming the beta shipped.
      - name: Push beta tag + create pre-release (per product)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS=$'\x1f' read -r id pname dist ver label rtag; do
            echo "::group::publish $id → $rtag"
            if git rev-parse "refs/tags/$rtag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$rtag" >/dev/null 2>&1; then
              echo "tag $rtag already exists — skipping (idempotent re-run)"; echo "::endgroup::"; continue
            fi
            git tag -a "$rtag" -m "Beta $rtag"
            git push origin "$rtag"
            NOTES_ARG=(--notes "Beta $rtag ($pname $ver)")
            if [ -f "/tmp/notes-$id.md" ] && [ -s "/tmp/notes-$id.md" ]; then
              NOTES_ARG=(--notes-file "/tmp/notes-$id.md")
            fi
            # No `gh release upload` — an App-Store-only product has no
            # downloadable asset; the build lives in TestFlight.
            gh release create "$rtag" --repo "$REPO" --title "$rtag" --prerelease "${NOTES_ARG[@]}"
            echo "pushed $rtag + pre-release ✅"; echo "::endgroup::"
          done < /tmp/products.tsv

      # ── Run summary ────────────────────────────────────────────────────────
      - name: Write beta summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Betas cut ✅  (build \`${BUILD_NUMBER}\`)"
            echo
            echo "| Product | Version | Tag | Where |"
            echo "|---|---|---|---|"
            while IFS=$'\x1f' read -r id pname dist ver label rtag; do
              if [ "$dist" = "True" ]; then
                echo "| ${pname} | ${ver} | \`${rtag}\` | TestFlight |"
              else
                echo "| ${pname} | ${ver} | \`${rtag}\` | (not distributed) |"
              fi
            done < /tmp/products.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f /tmp/notes-*.md /tmp/products.tsv
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
