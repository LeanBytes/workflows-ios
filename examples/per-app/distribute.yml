# ── Per-app distribute shell (iOS) ───────────────────────────────────────────
# Copy to .github/workflows/distribute.yml. Fires on every push to main,
# and on a manual run (workflow_dispatch, below).
# The orchestrator discovers Config/products/<id>.json and builds each product
# whose OWN file (or its source-paths) changed since its last build. Each
# product uploads to TestFlight (Ad Hoc: S3), then pushes its own
# <id>-v<ver>-<build number> tag + a notes-only GitHub release.
# ─────────────────────────────────────────────────────────────────────────────
name: Distribute

on:
  push:
    branches: [main]

  # Manual build. Normally a product builds only when its file (or its
  # source-paths) changed since its last build; tick the box to build anyway —
  # a TestFlight build about to expire (90 days), the yearly Ad Hoc profile
  # renewal (update the profile secret first), a toolchain or dependency bump,
  # a flaky runner. It does NOT override "already released": bump the changelog
  # version for that. Run it against main: on any other branch it ships and
  # tags that branch's commit instead.
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  distribute:
    uses: LeanBytes/workflows-ios/.github/workflows/distribute.yml@v0.4.0
    # The explicit list works in every configuration. `secrets: inherit` is a
    # same-org shortcut only — it silently passes NOTHING once the call chain
    # crosses an account boundary, and every signing step then fails with a
    # `security: SecKeychainItemImport` error.
    secrets:
      APPLE_DISTR_P12_BASE64:       ${{ secrets.APPLE_DISTR_P12_BASE64 }}
      APPLE_DISTR_PASSWORD:         ${{ secrets.APPLE_DISTR_PASSWORD }}
      KEYCHAIN_PASSWORD:            ${{ secrets.KEYCHAIN_PASSWORD }}
      PROV_PROF_STORE_BASE64:       ${{ secrets.PROV_PROF_STORE_BASE64 }}
      # Per-product overrides a product file names via profile-secret / cert-secret:
      # PROV_PROF_STORE_PRO_BASE64: ${{ secrets.PROV_PROF_STORE_PRO_BASE64 }}
      # APPLE_DISTR_P12_ALT_BASE64: ${{ secrets.APPLE_DISTR_P12_ALT_BASE64 }}
      # APPLE_DISTR_PASSWORD_ALT:   ${{ secrets.APPLE_DISTR_PASSWORD_ALT }}
      ASC_KEY_ID:                   ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:                ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64:               ${{ secrets.ASC_KEY_BASE64 }}
      SHARED_WORKFLOWS_TOKEN:       ${{ secrets.SHARED_WORKFLOWS_TOKEN }}
      # JIRA_API_TOKEN:             ${{ secrets.JIRA_API_TOKEN }}   # if run-tests
    with:
      # false on a push (the input does not exist there), true only when the box
      # is ticked on a manual run. Keep this line even if you add nothing else.
      force: ${{ inputs.force || false }}
    # ── Defaults a product file inherits when it omits them ─────────────────
    # Uncomment what you need — they belong under the `with:` above.
    #   distribute: false                # build + sign only, never touch ASC (dry run)
    #   use-tuist: true
    #   lfs: true
    #   # runners default to self-hosted macOS ([self-hosted, macOS]); override here, e.g.:
    #   runs-on-build: '["self-hosted","agent-alex"]'   # pin to a specific runner
    #   runs-on-publish: '"macos-26"'                    # or send a job back to a hosted runner
    #   run-tests: true                  # gate the build on tests (files a Jira ticket on failure)
    #   test-destination: 'platform=iOS Simulator,name=iPhone 17'
    #   artifact-retention-days: 30      # keep uploaded build/test artifacts longer than the 7-day default
